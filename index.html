<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reprocann</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<main class="app">
<section id="acceso" class="acceso">
<h1>Reprocann</h1>
<p>Ingresá tu clave de 4 dígitos.</p>
<input id="pinInput" type="password" inputmode="numeric" maxlength="4" placeholder="Clave">
<button id="pinBtn">Ingresar</button>
<p id="pinMensaje" class="pedido-msg" role="status"></p>
</section>

<section id="panel" class="hidden">
<header class="top">
<div>
<p class="eyebrow">Seguimiento mensual</p>
<h1>Reprocann</h1>
</div>
<div id="usuario" class="usuario"></div>
</header>

<section id="resumen" class="resumen"></section>
<div class="barra"><div id="fill"></div></div>

<section id="pedido" class="pedido"></section>

<details class="historial">
<summary>
<span>Ver entregas</span>
<small id="entregasResumen"></small>
</summary>
<div id="lista"></div>
</details>
</section>
</main>

<script type="module" src="./app.js"></script>
</body>
</html>
